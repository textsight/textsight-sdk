[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "textsight"
version = "0.1.1"
description = "Python client for the TextSight AI detector and AI humanizer API: detect ChatGPT, Claude and Gemini text and humanize AI writing."
readme = "README.md"
license = "MIT"
authors = [{ name = "TextSight", email = "support@textsight.ai" }]
requires-python = ">=3.8"
dependencies = []
keywords = ["ai detector", "ai content detector", "chatgpt detector", "ai humanizer", "gptzero alternative", "ai text detection", "textsight"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Topic :: Text Processing :: Linguistic",
  "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://www.textsight.ai/"
Documentation = "https://www.textsight.ai/api-docs.html"
"Get an API key" = "https://app.textsight.ai/signup"

[project.scripts]
textsight = "textsight.__main__:main"

[tool.setuptools]
packages = ["textsight"]
